name: Android internal bundle
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique Android version code
        default: '9'
        required: true
        type: string
      ads_mode:
        description: Use official test ads or Font V live ad units
        type: choice
        default: test
        options: [test, live]
permissions:
  contents: read
concurrency:
  group: fontv-android-internal
  cancel-in-progress: false
jobs:
  signed-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle-central-mirror
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - name: Configure temporary upload signing
        run: node tool/android_ci_signing.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: flutter pub get && flutter analyze && flutter test
      - name: Build signed AAB
        env:
          FONTV_BUILD_NUMBER: ${{ inputs.build_number }}
          FONTV_TEST_ADS: ${{ inputs.ads_mode != 'live' }}
        run: |
          [[ "$FONTV_BUILD_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          flutter build appbundle --release --build-name=2.0.0 --build-number="$FONTV_BUILD_NUMBER" --dart-define=USE_TEST_ADS="$FONTV_TEST_ADS"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          flutter build apk --release --build-name=2.0.0 --build-number="$FONTV_BUILD_NUMBER" --dart-define=USE_TEST_ADS="$FONTV_TEST_ADS"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/smoke.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify minified release startup twice
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tool/android_startup_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FontV-Android-startup-check
          path: |
            artifacts/android-startup*.log
            artifacts/android-startup.png
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FontV-Play-internal-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: node tool/android_ci_signing.mjs --cleanup
