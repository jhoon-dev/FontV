name: Store screenshots
on:
  workflow_dispatch:
    inputs:
      ios_form:
        description: Capture all platforms or only one iOS form factor
        type: choice
        default: all
        options: [all, iphone, ipad]
permissions:
  contents: read
jobs:
  ios:
    strategy:
      matrix:
        form: ${{ fromJSON(inputs.ios_form == 'ipad' && '["ipad"]' || inputs.ios_form == 'iphone' && '["iphone"]' || '["iphone","ipad"]') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get
      - name: Capture actual iPhone and iPad font catalogs
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for FORM in '${{ matrix.form }}'; do
            DEVICE=$(xcrun simctl list devices available -j | python3 tool/select_ios_simulator.py "$FORM")
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d "$DEVICE" 2>&1 | tee "artifacts/store-$FORM.log"
            mkdir -p "artifacts/store/$FORM"
            mv artifacts/screenshots/*.png "artifacts/store/$FORM/"
            xcrun simctl shutdown "$DEVICE"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FontV-store-${{ matrix.form }}
          path: artifacts/
          retention-days: 14
  android:
    if: inputs.ios_form == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android font catalog
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: mkdir -p artifacts && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FontV-store-Android
          path: artifacts/
          retention-days: 14
