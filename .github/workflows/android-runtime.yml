name: Android release runtime
on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Successful Android internal bundle workflow run ID
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-startup:
    name: Android ${{ matrix.api }} release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Select successful release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ inputs.bundle_run_id }}
        run: |
          BUNDLE_RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$BUNDLE_RUN_ID" ]; then
            BUNDLE_RUN_ID=$(gh run list --workflow android-internal.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          echo "run_id=$BUNDLE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FontV-Play-internal-AAB
          run-id: ${{ steps.bundle.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/bundle
      - name: Convert published release code into an installable test APK
        run: |
          curl --fail --location --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 30
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=artifacts/bundle/app-release.aab --output=artifacts/release.apks --mode=universal --ks="$RUNNER_TEMP/smoke.jks" --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -p artifacts/release.apks universal.apk > artifacts/smoke.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tool/android_startup_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FontV-Android-runtime-${{ matrix.api }}
          path: |
            artifacts/android-startup*.log
            artifacts/android-startup.png
          retention-days: 7
