name: Android release runtime
on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Successful Android internal bundle workflow run ID
        required: true
        default: '42339570901'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: FontV-Play-internal-AAB
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/bundle
      - name: Convert published release code into an installable test APK
        run: |
          curl --fail --location --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 30
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=artifacts/bundle/app-release.aab --output=artifacts/release.apks --mode=universal --ks="$RUNNER_TEMP/smoke.jks" --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -p artifacts/release.apks universal.apk > artifacts/smoke.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tool/android_startup_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FontV-Android-runtime-diagnostics
          path: |
            artifacts/android-startup.log
            artifacts/android-startup.png
          retention-days: 7
