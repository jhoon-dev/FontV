name: Font toolkit native checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'integration_test/toolkit_test.dart'
      - '.github/workflows/toolkit-smoke.yml'
      - '.github/actions/gradle-central-mirror/**'
permissions:
  contents: read
concurrency:
  group: font-toolkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get
      - name: Verify native font tools and capture comparison
        timeout-minutes: 22
        run: |
          set -euo pipefail
          mkdir -p artifacts
          flutter build ios --simulator --debug --target=integration_test/toolkit_test.dart 2>&1 | tee artifacts/toolkit-build.log
          DEVICE=$(xcrun simctl list devices available -j | python3 tool/select_ios_simulator.py iphone)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          flutter drive --use-application-binary=build/ios/iphonesimulator/Runner.app --disable-dds --driver=test_driver/integration_test.dart --target=integration_test/toolkit_test.dart -d "$DEVICE" 2>&1 | tee artifacts/toolkit-ios.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: FontV-toolkit-iOS
          path: artifacts/
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/gradle-central-mirror
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native font tools and capture comparison
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: mkdir -p artifacts && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/toolkit_test.dart -d emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: FontV-toolkit-Android
          path: artifacts/
          retention-days: 14
